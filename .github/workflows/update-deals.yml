name: Refresh deals and publish dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: deal-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect feeds
        run: python scripts/collect.py
      - name: Save refreshed dataset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/deals.json
          git diff --cached --quiet || (git commit -m 'Refresh deal feeds' && git push)
      - name: Prepare publish directory
        run: |
          mkdir -p _site/data
          cp index.html app.js styles.css _site/
          cp data/deals.json _site/data/deals.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: refresh
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
